name: Publish Staging Image

on:
  workflow_dispatch:
    inputs:
      recreate_runtime_package:
        description: Delete and recreate the noki-finance-runtime package before publishing.
        required: false
        type: boolean
        default: false
      delete_runtime_package_only:
        description: Delete the noki-finance-runtime package and stop before publishing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: finance-publish-staging-image-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_PLATFORM: linux/amd64
  IMAGE_REPOSITORY: ghcr.io/agrismartchain/noki-finance-runtime

jobs:
  publish:
    name: Publish Finance Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout requested commit
        # actions/checkout v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit is origin/main
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin main --prune

          source_commit="$(git rev-parse HEAD)"
          origin_main="$(git rev-parse origin/main)"

          if [[ "${source_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Checked out commit does not match GITHUB_SHA." >&2
            exit 1
          fi

          if [[ "${source_commit}" != "${origin_main}" ]]; then
            echo "Refusing to publish: checked out commit is not origin/main." >&2
            echo "source_commit=${source_commit}" >&2
            echo "origin_main=${origin_main}" >&2
            exit 1
          fi

          if [[ "${IMAGE_REPOSITORY}" == *:latest* ]]; then
            echo "Refusing to publish a latest tag." >&2
            exit 1
          fi

          {
            echo "source_commit=${source_commit}"
            echo "tag=${IMAGE_REPOSITORY}:${source_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Recreate runtime package when requested
        if: ${{ inputs.recreate_runtime_package || inputs.delete_runtime_package_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: noki-finance-runtime
        run: |
          set -Eeuo pipefail

          package_visibility="$(gh api "/user/packages/container/${PACKAGE_NAME}" --jq '.visibility' 2>/dev/null || true)"
          if [[ -z "${package_visibility}" ]]; then
            echo "Runtime package does not exist yet; nothing to recreate."
            exit 0
          fi

          if [[ "${package_visibility}" == "private" ]]; then
            echo "Runtime package is already private; keeping existing package."
            exit 0
          fi

          if [[ "${package_visibility}" != "public" ]]; then
            echo "Refusing to recreate package with unexpected visibility: ${package_visibility}" >&2
            exit 1
          fi

          gh api -X DELETE "/user/packages/container/${PACKAGE_NAME}"

          for attempt in {1..20}; do
            if ! gh api "/user/packages/container/${PACKAGE_NAME}" >/dev/null 2>&1; then
              echo "Runtime package deleted for private recreation."
              exit 0
            fi
            sleep 3
          done

          echo "Runtime package still exists after deletion request." >&2
          exit 1

      - name: Setup Docker Buildx
        if: ${{ !inputs.delete_runtime_package_only }}
        # docker/setup-buildx-action v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        if: ${{ !inputs.delete_runtime_package_only }}
        # docker/login-action v4.4.0
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture OCI created timestamp
        if: ${{ !inputs.delete_runtime_package_only }}
        id: created
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Publish Finance image
        if: ${{ !inputs.delete_runtime_package_only }}
        id: publish
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORM }}
          tags: ${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.source_commit }}
            org.opencontainers.image.version=${{ steps.source.outputs.source_commit }}
            org.opencontainers.image.created=${{ steps.created.outputs.value }}
            org.opencontainers.image.title=noki-finance-runtime
            org.opencontainers.image.description=Immutable NOKI Finance runtime frontend image.
            org.opencontainers.image.licenses=UNLICENSED
          sbom: true
          provenance: mode=max

      - name: Verify published digest
        if: ${{ !inputs.delete_runtime_package_only }}
        id: digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail

          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest." >&2
            exit 1
          fi

          {
            echo "digest=${DIGEST}"
            echo "reference=${IMAGE_REPOSITORY}@${DIGEST}"
          } >> "${GITHUB_OUTPUT}"

          echo "Published digest: ${DIGEST}"
          echo "Immutable reference: ${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify runtime package is private
        if: ${{ !inputs.delete_runtime_package_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: noki-finance-runtime
        run: |
          set -Eeuo pipefail

          visibility="$(gh api "/user/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          if [[ "${visibility}" != "private" ]]; then
            echo "Runtime package visibility must be private; got ${visibility}." >&2
            exit 1
          fi

          echo "Runtime package visibility: private"

      - name: Write publication summary
        if: ${{ !inputs.delete_runtime_package_only }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "## Finance image publication"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${IMAGE_REPOSITORY}\` |"
            echo "| Source commit | \`${{ steps.source.outputs.source_commit }}\` |"
            echo "| SHA tag | \`${{ steps.source.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.digest.outputs.digest }}\` |"
            echo "| Immutable reference | \`${{ steps.digest.outputs.reference }}\` |"
            echo "| Platform | \`${DOCKER_PLATFORM}\` |"
            echo "| Staging alias tag | not published |"
          } >> "${GITHUB_STEP_SUMMARY}"
